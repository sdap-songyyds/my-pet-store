spring:
  application:
    name: MyCourseStore
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mycoursestore}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
