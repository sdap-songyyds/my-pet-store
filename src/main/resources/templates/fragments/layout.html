<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · MyCourseStore'">MyCourseStore</title>
    <link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
          integrity="sha384-nWN3KqaaVcbEsCjLSV+2jMjh62Iny/+mN3srM8TZeM8N6aj7eDl5wwYggjAJ4/sJ" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:fragment="nav" class="topbar">
    <div class="container topbar-inner">
        <a class="brand" th:href="@{/}"><i class="bi bi-shop-window" aria-hidden="true"></i> MyCourseStore</a>
        <nav class="nav-links">
            <a th:href="@{/}"><i class="bi bi-house-door" aria-hidden="true"></i> 首页</a>
            <th:block th:if="${currentUser != null}">
                <a th:href="@{/cart}">
                    <i class="bi bi-cart3" aria-hidden="true"></i> 购物车<span class="nav-badge"
                        th:if="${cartCount != null and cartCount > 0}" th:text="${cartCount}">0</span>
                </a>
                <span class="nav-user">
                    <i class="bi bi-person-circle" aria-hidden="true"></i>
                    <span th:text="${currentUser.getDisplayName()}">用户</span>
                </span>
                <a th:href="@{/account}"><i class="bi bi-person-gear" aria-hidden="true"></i> 用户中心</a>
                <form th:action="@{/logout}" method="post" class="inline-form">
                    <button type="submit" class="link-button">
                        <i class="bi bi-box-arrow-right" aria-hidden="true"></i> 退出
                    </button>
                </form>
            </th:block>
            <th:block th:if="${currentUser == null}">
                <a th:href="@{/login}"><i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> 登录</a>
                <a class="button button-small" th:href="@{/register}">
                    <i class="bi bi-person-plus" aria-hidden="true"></i> 注册
                </a>
            </th:block>
        </nav>
    </div>
</header>
</body>
</html>
