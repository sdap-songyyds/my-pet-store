<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('操作失败')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>

<main class="auth-main">
    <section class="card auth-card error-page">
        <i class="bi bi-exclamation-triangle error-icon" aria-hidden="true"></i>
        <p class="error-code" th:text="${status} ?: 500">500</p>
        <h1>操作未完成</h1>
        <p class="muted" th:text="${message ?: '请稍后重试。'}">请稍后重试。</p>
        <a class="button" th:href="@{/}">
            <i class="bi bi-house-door" aria-hidden="true"></i> 返回首页
        </a>
    </section>
</main>
</body>
</html>
