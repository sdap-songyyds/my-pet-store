<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('页面不存在')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>

<main class="auth-main">
    <section class="card auth-card error-page">
        <i class="bi bi-compass error-icon" aria-hidden="true"></i>
        <p class="error-code">404</p>
        <h1>页面不存在</h1>
        <p class="muted">你访问的页面可能已被移除，或商品暂时未上架。</p>
        <a class="button" th:href="@{/}">
            <i class="bi bi-house-door" aria-hidden="true"></i> 返回首页
        </a>
    </section>
</main>
</body>
</html>
