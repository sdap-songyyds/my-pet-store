<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('重置密码')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>

<main class="container admin-main">
    <div class="admin-head">
        <div>
            <p class="admin-kicker">后台管理</p>
            <h1>重置密码</h1>
            <p class="muted">
                <span th:text="${user.displayName()}">用户</span>
                <span> · </span>
                <span th:text="${'@' + user.username()}">@username</span>
            </p>
        </div>
        <a class="button button-ghost"
           th:href="@{/admin/users(keyword=${keyword}, role=${role}, status=${status}, page=${page}, size=${size})}">
            <i class="bi bi-arrow-left" aria-hidden="true"></i> 返回列表
        </a>
    </div>

    <nav th:replace="~{admin/fragments/tabs :: tabs('users')}"></nav>

    <section class="card">
        <div class="admin-note">
            <i class="bi bi-info-circle" aria-hidden="true"></i>
            <span>重置密码不会立即让已有登录失效；该用户已登录的会话将在 2 小时内自然过期。</span>
        </div>

        <dl class="info-list">
            <div>
                <dt>角色</dt>
                <dd th:text="${user.roleLabel()}">顾客</dd>
            </div>
            <div>
                <dt>状态</dt>
                <dd th:text="${user.statusLabel()}">启用</dd>
            </div>
            <div>
                <dt>注册时间</dt>
                <dd th:text="${user.createdAtText()}">-</dd>
            </div>
        </dl>

        <div class="alert alert-error"
             th:if="${passwordGlobalErrors != null and !#lists.isEmpty(passwordGlobalErrors)}"
             th:text="${#strings.listJoin(passwordGlobalErrors, '；')}"></div>

        <form th:action="@{/admin/users/{id}/password(id=${user.id()})}" method="post" class="form">
            <input type="hidden" name="keyword" th:value="${keyword}">
            <input type="hidden" name="role" th:value="${role}">
            <input type="hidden" name="status" th:value="${status}">
            <input type="hidden" name="page" th:value="${page}">
            <input type="hidden" name="size" th:value="${size}">

            <label class="field">
                <span>新密码</span>
                <input type="password" name="newPassword" autocomplete="new-password" required
                       minlength="8" maxlength="72" autofocus>
                <small class="hint">8-72 个字符，使用 BCrypt 重新散列保存</small>
                <small class="field-error"
                       th:if="${passwordFieldErrors != null and passwordFieldErrors['newPassword'] != null}"
                       th:text="${#strings.listJoin(passwordFieldErrors['newPassword'], '；')}"></small>
            </label>

            <label class="field">
                <span>确认新密码</span>
                <input type="password" name="confirmPassword" autocomplete="new-password" required
                       minlength="8" maxlength="72">
                <small class="field-error"
                       th:if="${passwordFieldErrors != null and passwordFieldErrors['confirmPassword'] != null}"
                       th:text="${#strings.listJoin(passwordFieldErrors['confirmPassword'], '；')}"></small>
            </label>

            <div class="admin-form-actions">
                <button type="submit" class="button">重置密码</button>
                <a class="button button-ghost"
                   th:href="@{/admin/users(keyword=${keyword}, role=${role}, status=${status}, page=${page}, size=${size})}">
                    取消
                </a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
