<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${editing ? '编辑商品' : '新增商品'})}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>

<main class="container admin-main">
    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <div class="admin-head">
        <div>
            <p class="admin-kicker">后台管理</p>
            <h1 th:text="${editing ? '编辑商品' : '新增商品'}">新增商品</h1>
            <p class="muted" th:text="${editing ? 'SKU 与分类创建后不可修改。' : '新商品创建后默认为草稿状态。'}">
                新商品创建后默认为草稿状态。
            </p>
        </div>
        <a class="button button-ghost" th:href="@{/admin/products}">
            <i class="bi bi-arrow-left" aria-hidden="true"></i> 返回列表
        </a>
    </div>

    <nav class="admin-tabs" aria-label="后台功能">
        <a class="admin-tab is-active" th:href="@{/admin/products}">
            <i class="bi bi-box-seam" aria-hidden="true"></i> 商品
        </a>
    </nav>

    <section class="card">
        <div class="alert alert-error"
             th:if="${productGlobalErrors != null and !#lists.isEmpty(productGlobalErrors)}"
             th:text="${#strings.listJoin(productGlobalErrors, '；')}"></div>

        <form th:action="@{${formAction}}" method="post" class="form">
            <input type="hidden" name="version" th:if="${editing}" th:value="${form.version()}">

            <div class="field-row">
                <label class="field" th:if="${!editing}">
                    <span>SKU</span>
                    <input type="text" name="sku" required maxlength="40" autofocus
                           th:value="${form.sku()}">
                    <small class="hint">全局唯一，创建后不可修改</small>
                    <small class="field-error"
                           th:if="${productFieldErrors != null and productFieldErrors['sku'] != null}"
                           th:text="${#strings.listJoin(productFieldErrors['sku'], '；')}"></small>
                </label>

                <div class="field" th:if="${editing}">
                    <span>SKU</span>
                    <p class="admin-readonly" th:text="${product.sku()}">SKU</p>
                    <small class="hint">创建后不可修改</small>
                </div>

                <label class="field" th:if="${!editing}">
                    <span>分类</span>
                    <select name="categoryId" required>
                        <option value="">请选择二级分类</option>
                        <optgroup th:each="group : ${categoryGroups}" th:label="${group.name()}">
                            <option th:each="child : ${group.children()}"
                                    th:value="${child.id()}"
                                    th:text="${child.name()}"
                                    th:selected="${form.categoryId() != null and form.categoryId() == child.id()}">
                            </option>
                        </optgroup>
                    </select>
                    <small class="hint">必须归属二级分类；创建后不可修改</small>
                    <small class="field-error"
                           th:if="${productFieldErrors != null and productFieldErrors['categoryId'] != null}"
                           th:text="${#strings.listJoin(productFieldErrors['categoryId'], '；')}"></small>
                </label>

                <div class="field" th:if="${editing}">
                    <span>分类</span>
                    <p class="admin-readonly" th:text="${product.categoryPath()}">分类</p>
                    <small class="hint">创建后不可修改</small>
                </div>
            </div>

            <label class="field">
                <span>商品名称</span>
                <input type="text" name="name" required maxlength="120"
                       th:value="${form.name()}">
                <small class="field-error"
                       th:if="${productFieldErrors != null and productFieldErrors['name'] != null}"
                       th:text="${#strings.listJoin(productFieldErrors['name'], '；')}"></small>
            </label>

            <label class="field">
                <span>简介</span>
                <input type="text" name="summary" maxlength="500"
                       th:value="${form.summary() ?: ''}">
                <small class="field-error"
                       th:if="${productFieldErrors != null and productFieldErrors['summary'] != null}"
                       th:text="${#strings.listJoin(productFieldErrors['summary'], '；')}"></small>
            </label>

            <label class="field">
                <span>详情</span>
                <textarea name="description" rows="7" maxlength="20000"
                          th:text="${form.description() ?: ''}"></textarea>
                <small class="hint">纯文本，详情页会转义展示。</small>
            </label>

            <label class="field">
                <span>封面路径</span>
                <input type="text" name="coverImage" required maxlength="255"
                       th:value="${form.coverImage()}">
                <small class="hint"
                       th:text="${'站内相对路径，例如 ' + defaultCover + '；本期不做文件上传。'}">
                    站内相对路径
                </small>
                <small class="field-error"
                       th:if="${productFieldErrors != null and productFieldErrors['coverImage'] != null}"
                       th:text="${#strings.listJoin(productFieldErrors['coverImage'], '；')}"></small>
            </label>

            <div class="field-row">
                <label class="field">
                    <span>价格（元）</span>
                    <input type="number" name="price" step="0.01" min="0.01" required
                           th:value="${form.price()}">
                    <small class="field-error"
                           th:if="${productFieldErrors != null and productFieldErrors['price'] != null}"
                           th:text="${#strings.listJoin(productFieldErrors['price'], '；')}"></small>
                </label>

                <label class="field" th:if="${!editing}">
                    <span>初始库存</span>
                    <input type="number" name="stock" min="0" step="1" required
                           th:value="${form.stock()}">
                    <small class="field-error"
                           th:if="${productFieldErrors != null and productFieldErrors['stock'] != null}"
                           th:text="${#strings.listJoin(productFieldErrors['stock'], '；')}"></small>
                </label>

                <div class="field" th:if="${editing}">
                    <span>当前库存</span>
                    <p class="admin-readonly" th:text="${product.stock()}">0</p>
                    <small class="hint">库存调整将在库存管理中完成</small>
                </div>
            </div>

            <label class="field">
                <span>排序</span>
                <input type="number" name="sortOrder" min="0" step="1" required
                       th:value="${form.sortOrder()}">
                <small class="hint">数值越小越靠前</small>
                <small class="field-error"
                       th:if="${productFieldErrors != null and productFieldErrors['sortOrder'] != null}"
                       th:text="${#strings.listJoin(productFieldErrors['sortOrder'], '；')}"></small>
            </label>

            <small class="field-error"
                   th:if="${productFieldErrors != null and productFieldErrors['version'] != null}"
                   th:text="${#strings.listJoin(productFieldErrors['version'], '；')}"></small>

            <div class="admin-form-actions">
                <button type="submit" class="button"
                        th:text="${editing ? '保存修改' : '创建商品'}">创建商品</button>
                <a class="button button-ghost" th:href="@{/admin/products}">取消</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
