<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('库存管理')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>

<main class="container admin-main">
    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <div class="admin-head">
        <div>
            <p class="admin-kicker">后台管理</p>
            <h1>库存管理</h1>
            <p class="muted">
                缺货为 0，低库存为 1–<span th:text="${lowStockThreshold}">10</span>；筛选均包含草稿商品。
            </p>
        </div>
    </div>

    <nav th:replace="~{admin/fragments/tabs :: tabs('inventory')}"></nav>

    <section class="card admin-list-card">
        <form class="admin-filters" method="get" th:action="@{/admin/inventory}">
            <label class="field">
                <span>关键字</span>
                <input type="text" name="keyword" maxlength="120" placeholder="商品名称或 SKU"
                       th:value="${filter.keyword() ?: ''}">
            </label>

            <label class="field">
                <span>分类</span>
                <select name="categoryId">
                    <option value="">全部分类</option>
                    <optgroup th:each="group : ${categoryGroups}" th:label="${group.name()}">
                        <option th:each="child : ${group.children()}"
                                th:value="${child.id()}"
                                th:text="${child.name()}"
                                th:selected="${filter.categoryId() != null and filter.categoryId() == child.id()}">
                        </option>
                    </optgroup>
                </select>
            </label>

            <label class="field">
                <span>库存状态</span>
                <select name="level">
                    <option value="">全部库存</option>
                    <option value="OUT_OF_STOCK"
                            th:selected="${filter.level() != null and filter.level().name() == 'OUT_OF_STOCK'}">缺货</option>
                    <option value="LOW_STOCK"
                            th:selected="${filter.level() != null and filter.level().name() == 'LOW_STOCK'}">低库存</option>
                </select>
            </label>

            <div class="admin-filter-actions">
                <button type="submit" class="button">
                    <i class="bi bi-search" aria-hidden="true"></i> 筛选
                </button>
                <a class="button button-ghost" th:href="@{/admin/inventory}">重置</a>
            </div>
        </form>

        <div class="table-wrap" th:if="${!#lists.isEmpty(result.items())}">
            <table class="data-table">
                <thead>
                <tr>
                    <th>商品</th>
                    <th>SKU</th>
                    <th>分类</th>
                    <th>价格</th>
                    <th>当前库存</th>
                    <th>状态</th>
                    <th>库存调整</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${result.items()}">
                    <td>
                        <div class="table-product">
                            <img th:src="${'/' + p.coverImage()}" th:alt="${p.name()}"
                                 onerror="this.src='/images/placeholder.svg'">
                            <div>
                                <a th:href="@{/admin/products/{id}(id=${p.id()})}" th:text="${p.name()}">商品名称</a>
                                <span class="muted" th:text="${'#' + p.id()}">#1</span>
                            </div>
                        </div>
                    </td>
                    <td th:text="${p.sku()}">SKU</td>
                    <td th:text="${p.categoryPath()}">分类</td>
                    <td th:text="${'¥' + #numbers.formatDecimal(p.price(), 1, 2)}">¥0.00</td>
                    <td>
                        <span class="admin-stock"
                              th:classappend="${p.stock() == 0 ? ' is-out' : (p.stock() <= lowStockThreshold ? ' is-low' : '')}"
                              th:text="${p.stock()}">0</span>
                        <span class="admin-stock-label" th:if="${p.stock() == 0}">缺货</span>
                        <span class="admin-stock-label is-low"
                              th:if="${p.stock() > 0 and p.stock() <= lowStockThreshold}">低库存</span>
                    </td>
                    <td>
                        <span class="status-badge"
                              th:classappend="${' status-' + p.status().name()}"
                              th:text="${p.statusLabel()}">草稿</span>
                    </td>
                    <td>
                        <form class="admin-stock-form"
                              th:action="@{/admin/inventory/{id}/stock(id=${p.id()})}" method="post">
                            <input type="hidden" name="version" th:value="${p.version()}">
                            <input type="hidden" name="keyword" th:value="${filter.keyword() ?: ''}">
                            <input type="hidden" name="categoryId" th:value="${filter.categoryId() ?: ''}">
                            <input type="hidden" name="level" th:value="${filter.level() != null ? filter.level().name() : ''}">
                            <input type="hidden" name="page" th:value="${result.page()}">
                            <input type="hidden" name="size" th:value="${result.size()}">
                            <input type="number" name="stock" min="0" step="1" required
                                   th:value="${p.stock()}" aria-label="库存">
                            <button type="submit" class="button button-small">保存</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="empty-state" th:if="${#lists.isEmpty(result.items())}">
            <i class="bi bi-boxes empty-icon" aria-hidden="true"></i>
            <p>没有符合条件的商品</p>
            <p class="muted">可以调整筛选条件后再试。</p>
        </div>

        <div class="admin-pagination" th:if="${result.total() > 0}">
            <span class="muted"
                  th:text="${'共 ' + result.total() + ' 条，第 ' + result.page() + ' / ' + result.totalPages() + ' 页'}">
                共 0 条
            </span>
            <div class="admin-pagination-actions">
                <a class="button button-small button-ghost" th:if="${result.hasPrevious()}"
                   th:href="@{/admin/inventory(page=${result.page() - 1}, size=${result.size()}, keyword=${filter.keyword()}, categoryId=${filter.categoryId()}, level=${filter.level()})}">
                    <i class="bi bi-chevron-left" aria-hidden="true"></i> 上一页
                </a>
                <span class="button button-small button-ghost is-disabled" th:unless="${result.hasPrevious()}">
                    <i class="bi bi-chevron-left" aria-hidden="true"></i> 上一页
                </span>
                <a class="button button-small button-ghost" th:if="${result.hasNext()}"
                   th:href="@{/admin/inventory(page=${result.page() + 1}, size=${result.size()}, keyword=${filter.keyword()}, categoryId=${filter.categoryId()}, level=${filter.level()})}">
                    下一页 <i class="bi bi-chevron-right" aria-hidden="true"></i>
                </a>
                <span class="button button-small button-ghost is-disabled" th:unless="${result.hasNext()}">
                    下一页 <i class="bi bi-chevron-right" aria-hidden="true"></i>
                </span>
            </div>
        </div>
    </section>
</main>
</body>
</html>
